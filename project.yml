name: MyOpora
options:
  bundleIdPrefix: com.irozinko
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
targets:
  MyOpora:
    type: application
    platform: iOS
    sources:
      - path: MyOpora
    info:
      path: MyOpora/Info.plist
      properties:
        CFBundleDisplayName: Опора
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.irozinko.myopora
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
