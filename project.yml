name: MyOpora
options:
  bundleIdPrefix: com.irozinko
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
targets:
  MyOpora:
    type: application
    platform: iOS
    sources:
      - path: MyOpora
    info:
      path: MyOpora/Info.plist
      properties:
        CFBundleDisplayName: Opora
        UILaunchScreen: {}
        NSHealthShareUsageDescription: "Opora reads your step count from Apple Health to show daily movement progress."
        NSHealthUpdateUsageDescription: "Opora does not write data to Apple Health."
    entitlements:
      path: MyOpora/MyOpora.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.irozinko.myopora
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: MyOpora/MyOpora.entitlements
        INFOPLIST_FILE: MyOpora/Info.plist
        GENERATE_INFOPLIST_FILE: NO
